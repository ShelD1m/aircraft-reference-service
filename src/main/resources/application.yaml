server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: nsi-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nsi}
    username: ${SPRING_DATASOURCE_USERNAME:nsi}
    password: ${SPRING_DATASOURCE_PASSWORD:nsi_demo_password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
management:
  endpoints:
    web:
      exposure:
        include: health,info

integrations:
  auth:
    enabled: ${AUTH_ENABLED:false}
    base-url: ${AUTH_BASE_URL:http://localhost:8081}
    service-token: ${AUTH_SERVICE_TOKEN:}
  core:
    procedure-code: ${CORE_PROCEDURE_CODE:PRE_DEPARTURE}
    minute-policy: ${CORE_MINUTE_POLICY:exact}
    cache-ttl-seconds: ${CORE_CACHE_TTL_SECONDS:300}
    require-auth: ${CORE_REQUIRE_AUTH:false}
  logging:
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_AUDIT_TOPIC:hcc.audit.events.v1}
    batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:20}
    poll-interval-ms: ${KAFKA_OUTBOX_POLL_INTERVAL_MS:1000}
    send-timeout-ms: ${KAFKA_SEND_TIMEOUT_MS:5000}
