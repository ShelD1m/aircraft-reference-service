services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NSI_DB_NAME:-nsi}
      POSTGRES_USER: ${NSI_DB_USER:-nsi}
      POSTGRES_PASSWORD: ${NSI_DB_PASSWORD:-nsi_demo_password}
    ports:
      - "127.0.0.1:${NSI_DB_PORT:-5433}:5432"
    volumes:
      - nsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 4s
      retries: 15
      timeout: 3s
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${NSI_DB_NAME:-nsi}
      SPRING_DATASOURCE_USERNAME: ${NSI_DB_USER:-nsi}
      SPRING_DATASOURCE_PASSWORD: ${NSI_DB_PASSWORD:-nsi_demo_password}
      SERVER_PORT: 8080
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://host.docker.internal:8081}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-}
      CORE_REQUIRE_AUTH: ${CORE_REQUIRE_AUTH:-false}
      CORE_PROCEDURE_CODE: ${CORE_PROCEDURE_CODE:-PRE_DEPARTURE}
      CORE_MINUTE_POLICY: ${CORE_MINUTE_POLICY:-exact}
      CORE_CACHE_TTL_SECONDS: ${CORE_CACHE_TTL_SECONDS:-300}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_AUDIT_TOPIC: ${KAFKA_AUDIT_TOPIC:-hcc.audit.events.v1}
      KAFKA_OUTBOX_BATCH_SIZE: ${KAFKA_OUTBOX_BATCH_SIZE:-20}
      KAFKA_OUTBOX_POLL_INTERVAL_MS: ${KAFKA_OUTBOX_POLL_INTERVAL_MS:-1000}
      KAFKA_SEND_TIMEOUT_MS: ${KAFKA_SEND_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:${NSI_HTTP_PORT:-8082}:8080"
volumes:
  nsi_pgdata:
